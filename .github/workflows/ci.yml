name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: ["v0.10.4", "stable"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Run Sorcar tests
        run: nvim --headless -u NONE -l tests/run.lua
